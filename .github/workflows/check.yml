name: Workspace checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 demo/run.py projects/ci-demo
      - run: python -X utf8 demo/revise.py projects/ci-demo
      - run: python -X utf8 demo/lab.py projects/ci-lab
      - run: python -X utf8 -m strategist lab show projects/ci-lab
